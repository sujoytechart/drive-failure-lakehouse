[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "drive-failure-lakehouse"
version = "0.1.0"
description = "Databricks lakehouse pipeline for Backblaze drive telemetry"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
platform_smoke = "drive_failure_lakehouse.jobs.smoke:main"

[project.optional-dependencies]
dev = [
  "delta-spark>=4.0,<4.1",
  "mypy>=1.15,<2",
  "pyspark>=4.0,<4.1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/drive_failure_lakehouse"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
