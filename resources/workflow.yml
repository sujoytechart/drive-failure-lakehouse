resources:
  jobs:
    platform_smoke:
      name: ${bundle.target}-drive-failure-platform-smoke
      tasks:
        - task_key: platform_smoke
          python_wheel_task:
            package_name: drive_failure_lakehouse
            entry_point: platform_smoke
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 30000
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

    drive_failure_pipeline:
      name: ${bundle.target}-drive-failure-lakehouse
      schedule:
        quartz_cron_expression: "0 0 8 ? * MON"
        timezone_id: America/Detroit
        pause_status: PAUSED
      tasks:
        - task_key: bronze_ingestion
          python_wheel_task:
            package_name: drive_failure_lakehouse
            entry_point: bronze_ingestion
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${var.bronze_schema}
              - --silver-schema
              - ${var.silver_schema}
              - --gold-schema
              - ${var.gold_schema}
              - --volume
              - ${var.volume}
              - --period-start
              - ${var.period_start}
              - --period-end
              - ${var.period_end}
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 30000

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingestion
          python_wheel_task:
            package_name: drive_failure_lakehouse
            entry_point: silver_transform
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${var.bronze_schema}
              - --silver-schema
              - ${var.silver_schema}
              - --gold-schema
              - ${var.gold_schema}
              - --volume
              - ${var.volume}
              - --period-start
              - ${var.period_start}
              - --period-end
              - ${var.period_end}
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 30000

        - task_key: gold_metrics
          depends_on:
            - task_key: silver_transform
          python_wheel_task:
            package_name: drive_failure_lakehouse
            entry_point: gold_metrics
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${var.bronze_schema}
              - --silver-schema
              - ${var.silver_schema}
              - --gold-schema
              - ${var.gold_schema}
              - --volume
              - ${var.volume}
              - --period-start
              - ${var.period_start}
              - --period-end
              - ${var.period_end}
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 30000
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
